[workspace]
resolver = "2"
members = [".", "actors", "macros"]

[workspace.dependencies]
piying = { path = ".", version = "0.2.0" }
piying_macros = { path = "macros", version = "0.2.0" }

futures = "0.3"
tokio = "1.47"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[package.metadata.docs.rs]
all-features = true

[package]
name = "piying"
version = "0.2.0"
edition = "2024"
rust-version = "1.88.0"
description = "Fault-tolerant Async Actors Built on Tokio"
readme = "README.md"
repository = "https://github.com/caniko/piying-rs"
documentation = "https://docs.rs/piying"
license = "MIT OR Apache-2.0"
keywords = ["actor", "tokio"]
categories = ["asynchronous", "concurrency", "rust-patterns"]
include = [
  "/src",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]

[features]
default = ["macros", "tracing"]
macros = ["dep:piying_macros"]
remote = [
  "dep:const-fnv1a-hash",
  "dep:const-str",
  "dep:either",
  "dep:hickory-proto",
  "dep:libp2p",
  "dep:linkme",
]
rkyv = ["dep:rkyv"]
rkyv-codec = ["rkyv", "dep:libp2p-rkyv-codec"]
serde = ["dep:serde"]
serde-codec = ["serde", "dep:rmp-serde", "libp2p?/cbor"]
tracing = ["dep:tracing", "tokio/tracing"]
metrics = ["dep:metrics"]
hotpath = ["dep:hotpath", "hotpath/hotpath"]
# Test-only: when enabled, every libp2p protocol id piying advertises is
# suffixed with the value of `THESPAN_SESSION_ID` (if set) so two co-running
# test sessions can't cross-discover through shared KAD protocol ids. Production builds leave
# this off and the code is byte-identical to the unsuffixed path.
session-isolation = []

[dependencies]
piying_macros = { workspace = true, optional = true }

const-fnv1a-hash = { version = "1.1.0", optional = true }
const-str = { version = "1.1", features = ["proc"], optional = true }
anyhow = "1"
arc-swap = "1"
downcast-rs = "2.0.1"
dyn-clone = "1.0"
either = { version = "1.15.0", optional = true }
futures.workspace = true
# Enforce the safe mDNS dependency floor for consumers with their own lockfile.
# libp2p-mdns accepts the entire 0.26 series, including vulnerable 0.26.0.
hickory-proto = { version = "0.26.3", default-features = false, optional = true }
hotpath = { version = "0.11", optional = true, features = ["tokio"] }
libp2p = { version = "0.57.0", features = [
  "kad",
  "macros",
  "mdns",
  "noise",
  "quic",
  "request-response",
  "tcp",
  "tokio",
  "yamux",
  "mdns",
], optional = true }
linkme = { version = "0.3.28", optional = true }
metrics = { version = "0.24.2", optional = true }
# Keep this version-only for downstream users. Local co-development with the
# sibling vendor checkout belongs in the consuming workspace's `[patch.crates-io]`.
libp2p-rkyv-codec = { version = "0.3", optional = true }
rkyv = { version = "0.8", optional = true }
rmp-serde = { version = "1.3.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = "2.0"
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
piying_actors = { path = "actors" }
tokio = { version = "1", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-test = "0.4.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
