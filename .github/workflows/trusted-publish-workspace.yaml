  publish-report:
    needs: [publish-piying_macros, publish-piying, publish-piying_actors]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Release result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS"
          echo 'resume: rerun the original tag-push run; already-published crates with matching checksums exit 0 after exact registry resolution'
          echo 'see per-crate job statuses for the auditable result'
