        run: |
          set -euo pipefail
          .simit-publisher-engine/target/release/simit release publisher --publisher-stage prepare --repo "$GITHUB_REPOSITORY" --package piying --source-workflow .github/workflows/publish-workspace.yaml --publisher-workflow .github/workflows/trusted-publish-workspace.yaml --reconstruct-package piying_macros --reconstruct-package piying --reconstruct-package piying_actors --publisher-output "$RUNNER_TEMP/verified-piying" > "$RUNNER_TEMP/verified-piying.json"
      - name: Checkout original signed source for verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: .simit-release-source
          persist-credentials: false
      - name: Verify packaged contents piying
        working-directory: .simit-release-source
        run: cargo publish --dry-run --locked --manifest-path "$RUNNER_TEMP/verified-piying/Cargo.toml"
      - name: Required gate release-audit
