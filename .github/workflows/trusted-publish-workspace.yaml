# Generated by simit. Manual edits will be reported as ci=drift.
# Enroll only after moving CRATES_IO_API_TOKEN into the literal environment below,
# restricting it to the exact protected default branch, and qualifying the engine revision.
# Tag-controlled workflows must have no repository/org publishing credential.
# Recovery: rerun the original signed-tag run; matching immutable archives remain reusable.
name: Trusted Crate Publisher

on:
  workflow_run:
    workflows: ["Build Workspace Crates"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: simit-crates-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  verify-piying_macros:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - name: Require independently qualified publisher engine
        env:
          PUBLISHER_REVISION: ${{ vars.SIMIT_PUBLISHER_REVISION }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enroll a qualified immutable Simit publisher revision' >&2; exit 1; }
      - name: Checkout independent publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout qualified publisher engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: caniko/simit
          ref: ${{ vars.SIMIT_PUBLISHER_REVISION }}
          path: .simit-publisher-engine
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build trusted publisher engine
        working-directory: /
        run: cargo build --release --locked --manifest-path "$GITHUB_WORKSPACE/.simit-publisher-engine/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/.simit-publisher-engine/target"
      - name: Admit signed source and provider-bound archive piying_macros
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .simit-publisher-engine/target/release/simit release publisher --publisher-stage prepare --repo "$GITHUB_REPOSITORY" --package piying_macros --source-workflow .github/workflows/publish-workspace.yaml --publisher-workflow .github/workflows/trusted-publish-workspace.yaml --reconstruct-package piying_macros --reconstruct-package piying --reconstruct-package piying_actors --publisher-output "$RUNNER_TEMP/verified-piying_macros" > "$RUNNER_TEMP/verified-piying_macros.json"
      - name: Checkout original signed source for verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: .simit-release-source
          persist-credentials: false
      - name: Verify packaged contents piying_macros
        working-directory: .simit-release-source
        run: cargo publish --dry-run --locked --manifest-path "$RUNNER_TEMP/verified-piying_macros/Cargo.toml"
      - name: Required gate release-audit
        timeout-minutes: 20
        working-directory: .simit-release-source
        run: cargo install cargo-audit --locked && cargo audit
      - name: Required gate minimal-library
        timeout-minutes: 15
        working-directory: .simit-release-source
        run: cargo check --locked -p piying --lib --no-default-features && cargo check --locked -p piying --lib --no-default-features --features macros
      - name: Required gate feature-matrix
        timeout-minutes: 60
        working-directory: .simit-release-source
        run: cargo install just --locked --version 1.58.0 && just ci
      - name: Required gate packaging
        timeout-minutes: 15
        working-directory: .simit-release-source
        run: cargo package --workspace --allow-dirty --list && cargo package -p piying_macros --allow-dirty
  publish-piying_macros:
    needs: [verify-piying_macros]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: simit-crates-io
    steps:
      - name: Require independently qualified publisher engine
        env:
          PUBLISHER_REVISION: ${{ vars.SIMIT_PUBLISHER_REVISION }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enroll a qualified immutable Simit publisher revision' >&2; exit 1; }
