# Generated by simit. Manual edits will be reported as ci=drift.
# Credential-free signed-tag build. Rerun the original signed-tag run for recovery.
name: Build Workspace Crates

# GitHub crates.io publishers run only on signed semver tag pushes. Retry the original run rather than dispatching a branch.
on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Validate signed release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-}}}"
          if [ -z "$tag" ]; then
            ref="${GITHUB_REF:-${FORGE_REF:-${CODEBERG_REF:-}}}"
            tag="${ref#refs/tags/}"
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be an exact semver version like 0.1.1, got '$tag'" >&2
            exit 1
          fi
          if ! command -v gpg >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends gnupg
            else
              echo "gpg is required to verify signed release tags" >&2
              exit 1
            fi
          fi
          git_fetch() {
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              git -c "http.extraHeader=$auth_header" fetch "$@"
            else
              git fetch "$@"
            fi
          }
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          # The release checkout cannot supply its own verification key.
          # Fetch the repository's independently maintained default-branch key.
          git_fetch --no-tags origin HEAD
          git show "FETCH_HEAD:keys/maintainers.gpg" > "$GNUPGHOME/maintainers.gpg"
          test -s "$GNUPGHOME/maintainers.gpg"
          gpg --batch --import "$GNUPGHOME/maintainers.gpg"

          git_fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git verify-tag "$tag"
          signed_tag_name="$(git cat-file tag "refs/tags/$tag" | sed -n '1,/^$/s/^tag //p')"
          test "$signed_tag_name" = "$tag" || { echo 'Signed tag object name differs from the release label' >&2; exit 1; }
          validated_sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          checkout_sha="$(git rev-parse --verify HEAD)"
          if [ "$validated_sha" != "$checkout_sha" ]; then
            echo "Signed tag commit does not match the checkout being published" >&2
            exit 1
          fi

      - name: Required gate release-audit
        timeout-minutes: 20
        env:
          SIMIT_REQUIRED_GATE: "1"
        run: cargo install cargo-audit --locked && cargo audit
      - name: Required gate minimal-library
        timeout-minutes: 15
        env:
          SIMIT_REQUIRED_GATE: "1"
        run: cargo check --locked -p piying --lib --no-default-features && cargo check --locked -p piying --lib --no-default-features --features macros
      - name: Required gate feature-matrix
        timeout-minutes: 60
        env:
          SIMIT_REQUIRED_GATE: "1"
        run: cargo install just --locked --version 1.58.0 && just ci
      - name: Required gate packaging
        timeout-minutes: 15
        env:
          SIMIT_REQUIRED_GATE: "1"
        run: cargo package --workspace --allow-dirty --list && cargo package -p piying_macros --allow-dirty
      - name: Test piying_macros
        run: cargo test --locked -p piying_macros --all-targets --all-features
      - name: Clippy piying_macros
        run: cargo clippy --locked -p piying_macros --all-targets --all-features -- -D warnings
      - name: Test piying
        run: cargo test --locked -p piying --all-targets --all-features
      - name: Clippy piying
        run: cargo clippy --locked -p piying --all-targets --all-features -- -D warnings
      - name: Test piying_actors
        run: cargo test --locked -p piying_actors --all-targets --all-features
      - name: Clippy piying_actors
        run: cargo clippy --locked -p piying_actors --all-targets --all-features -- -D warnings
      - name: Package coordinated release set
        run: cargo package --locked --allow-dirty --no-verify -p piying_macros -p piying -p piying_actors --target-dir "$RUNNER_TEMP/simit-package-target"
      - name: Build immutable archive piying_macros
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(cargo pkgid --locked -p piying_macros | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/piying_macros"
          cp "$RUNNER_TEMP/simit-package-target/package/piying_macros-$version.crate" "$RUNNER_TEMP/simit-crates/piying_macros/"
      - name: Retain original-run archive piying_macros
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-piying_macros-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/piying_macros/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive piying
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(cargo pkgid --locked -p piying | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/piying"
          cp "$RUNNER_TEMP/simit-package-target/package/piying-$version.crate" "$RUNNER_TEMP/simit-crates/piying/"
      - name: Retain original-run archive piying
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-piying-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/piying/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive piying_actors
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(cargo pkgid --locked -p piying_actors | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/piying_actors"
          cp "$RUNNER_TEMP/simit-package-target/package/piying_actors-$version.crate" "$RUNNER_TEMP/simit-crates/piying_actors/"
      - name: Retain original-run archive piying_actors
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-piying_actors-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/piying_actors/*.crate
          if-no-files-found: error
          retention-days: 30
