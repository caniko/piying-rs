  publish-report:
    needs: [publish-piying-actors]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Release result
        run: |
          set -euo pipefail
          echo "coordinated workspace publish finished (see per-crate job statuses for the auditable result)"
          echo "resume: re-dispatch this workflow; already-published crates with matching checksums exit 0, conflicts fail"
