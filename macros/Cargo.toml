[package]
name = "piying_macros"
version = "0.2.0"
edition = "2024"
rust-version = "1.85.1"
description = "Fault-tolerant Async Actors Built on Tokio - macros"
readme = "../README.md"
repository = "https://github.com/caniko/piying-rs"
documentation = "https://docs.rs/piying_macros"
license = "MIT OR Apache-2.0"
keywords = ["actor", "tokio", "macros"]
categories = ["asynchronous", "concurrency", "rust-patterns"]
include = ["/src", "/LICENSE"]

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[dependencies]
heck = "0.5"
proc-macro2 = "1.0.78"
quote = "1.0.35"
syn = { version = "2.0.52", features = ["extra-traits", "full"] }
